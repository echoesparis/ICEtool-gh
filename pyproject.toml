[project]
name = "icetool-gh"
version = "2.0.0"
description = "Surface-temperature energy-balance solver, Rhino/Grasshopper port of ICEtool (QGIS Step 4)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22,<3",
    "scipy>=1.8,<2",
    "pandas>=1.4,<3",
]

[dependency-groups]
dev = ["pytest>=7"]
